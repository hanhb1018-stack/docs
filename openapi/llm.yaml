openapi: 3.0.3
info:
  title: GregAPI 大语言模型
  version: 1.0.0
  description: GregAPI 统一网关下的大语言模型（LLM）接口，覆盖通用对话补全、多模态响应，以及各家原生消息与生成协议。
servers:
  - url: https://api.gregapi.com
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /v1/chat/completions:
    post:
      summary: 通用对话接口
      description: 通过 GregAPI 兼容 OpenAI 的对话补全与工具调用接口，支持流式输出、函数调用（tools/functions）以及 JSON mode。
      x-mint:
        content: |
          ## 常见用法

          - **流式输出**：请求体设置 `stream: true`；cURL 添加 `-N`，Python 端用 `requests.post(..., stream=True)` 逐行读取。
          - **函数调用**：通过 `tools` 与 `tool_choice` 描述可调用函数，在响应中解析 `tool_calls` 执行业务逻辑。
          - **JSON 约束**：配合 `response_format` 设置为 `{"type": "json_schema"}` 让模型严格返回结构化数据。

          GregAPI 会自动对齐常见兼容接口中的差异字段，减少模型切换带来的适配成本。

          ## GregAPI 扩展字段

          `usage.prompt_tokens_details` 用于暴露上游模型的缓存计费明细：

          | 字段 | 含义 |
          | --- | --- |
          | `cached_tokens` | 命中缓存的输入 token 数 |
          | `cached_write_tokens` | 缓存写入总量（= 5m + 1h） |
          | `cached_write_5m_tokens` | 写入 5 分钟有效期缓存的 token 数 |
          | `cached_write_1h_tokens` | 写入 1 小时有效期缓存的 token 数 |

          其中 `prompt_tokens` 为输入 token 总量（含缓存命中与写入）。缓存写入相关字段为 `omitempty`，无缓存写入的模型不会输出。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  description: 模型名称
                messages:
                  type: array
                  description: 对话消息数组
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant, tool]
                      content:
                        type: string
                temperature:
                  type: number
                  description: 采样温度，默认 1
                stream:
                  type: boolean
                  description: 是否流式输出
                tools:
                  type: array
                  description: 可调用函数描述
                tool_choice:
                  type: string
                response_format:
                  type: object
                  description: 输出格式，例如 JSON Schema（json_schema）
            example:
              model: gpt-4o-mini
              messages:
                - role: system
                  content: 你是 GregAPI 的产品助理。
                - role: user
                  content: 用三句话介绍 GregAPI。
              temperature: 0.7
      responses:
        '200':
          description: 成功返回对话补全结果
  /v1/responses:
    post:
      summary: OpenAI 多模态响应接口
      description: 统一的多模态响应接口，可在一次请求中混合文本、图像等输入，并以结构化格式返回，支持 JSON mode 与工具序列。
      x-mint:
        content: |
          ## 流式与兼容

          - 设置 `stream: true` 可获得服务端事件（SSE）增量；需要兼容 Chat Completions 流格式时，GregAPI 已内置向后兼容处理。
          - 工具事件在流中以 `response.output_item.added` 体现，结束时携带 `usage` 聚合令牌统计。

          ## 技巧与注意事项

          - `input` 字段可以是字符串或复合数组，推荐使用数组以便混合文本、图像、文件引用等内容。
          - `response_format` 支持 `json_schema`、`text` 等选项。
          - 需要工具调用时在 `tools` 中声明可选函数，返回结果将出现在 `output` 的 `tool_calls` 字段里。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
              properties:
                model:
                  type: string
                  description: 模型名称
                input:
                  type: array
                  description: 输入消息，可为字符串或复合数组
                response_format:
                  type: object
                  description: 输出格式
                stream:
                  type: boolean
                  description: 是否流式输出
                tools:
                  type: array
                  description: 可选工具声明
            example:
              model: gpt-4.1
              input:
                - role: user
                  content:
                    - type: text
                      text: 请总结附件要点
              response_format:
                type: json_schema
      responses:
        '200':
          description: 成功返回结构化响应结果
  /v1/messages:
    post:
      summary: Claude 消息接口
      description: 使用 Anthropic Messages API 协议调用 Claude 模型，可直接使用官方 SDK 或 cURL 调用。
      x-mint:
        content: |
          ## 请求头

          除鉴权头外，请求需额外携带 `anthropic-version` 头：

          ```http
          Authorization: Bearer <TOKEN>
          anthropic-version: 2023-06-01
          Content-Type: application/json
          ```

          ## 构建方式

          |  | Messages API | Claude Managed Agents |
          | --- | --- | --- |
          | **是什么** | 直接调用模型、自行编排对话与工具 | 托管基础设施上的可配置 Agent 形态 |
          | **更适合** | 自定义 Agent 循环与细粒度控制每次调用 | 长时运行、异步类任务 |

          网关行为以 GregAPI 控制台说明为准；Anthropic 原生能力以官方文档为准。
      parameters:
        - name: anthropic-version
          in: header
          required: true
          schema:
            type: string
            example: '2023-06-01'
          description: Anthropic API 版本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - max_tokens
                - messages
              properties:
                model:
                  type: string
                  description: 模型名称
                max_tokens:
                  type: integer
                  description: 最大输出 token 数
                messages:
                  type: array
                  description: 对话消息数组
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
            example:
              model: claude-opus-4-6
              max_tokens: 1024
              messages:
                - role: user
                  content: 你好，请用一句话自我介绍。
      responses:
        '200':
          description: 成功返回消息结果
  /v1beta/models/{model}:generateContent:
    post:
      summary: Gemini 原生格式
      description: 使用 Gemini 原生接口（generateContent）进行对话与多模态交互，支持文本与多模态内容生成。
      x-mint:
        content: |
          ## 鉴权

          原生接口支持 `Authorization: Bearer <TOKEN>` 鉴权，也支持 `x-goog-api-key: <TOKEN>`。

          ## 多模态输入

          通过 `contents[].parts[]` 承载多模态内容：文本用 `text`，媒体用 `inline_data`（`mime_type` + Base64 `data`）。图片同理，`mime_type` 为 `image/png`、`image/jpeg` 等。

          ## 思考模式（Reasoning）

          - Gemini 3 系列使用 `generationConfig.thinkingConfig.thinkingLevel`（如 `high`）。
          - Gemini 2.5 系列使用 `generationConfig.thinkingConfig.thinkingBudget`（如 `8192`）。

          ## 生成参数

          | 参数 | 说明 | 默认值 |
          | --- | --- | --- |
          | `temperature` | 随机性，0-2 | 1.0 |
          | `max_tokens` | 最大输出 token 数 | 模型默认 |
          | `top_p` | 核采样概率 | 0.95 |
          | `stop` | 停止序列 | - |

          Gemini 3 建议保持 `temperature` 为 1.0，过低可能导致推理性能下降。
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
            example: gemini-2.5-flash
          description: 模型名称
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contents
              properties:
                contents:
                  type: array
                  description: 对话内容数组
                  items:
                    type: object
                    properties:
                      parts:
                        type: array
                        items:
                          type: object
                generationConfig:
                  type: object
                  description: 生成配置，如 temperature、thinkingConfig
            example:
              contents:
                - parts:
                    - text: 你好
      responses:
        '200':
          description: 成功返回生成结果